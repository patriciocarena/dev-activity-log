name: Daily activity

on:
  schedule:
    # 15:23 UTC (12:23 en Argentina/Chile). Minuto "raro" para evitar la cola de :00.
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make random daily commits
        env:
          # Debe ser un email verificado en la cuenta, si no los commits no cuentan en la grilla.
          AUTHOR_NAME: patriciocarena
          AUTHOR_EMAIL: 256461414+patriciocarena@users.noreply.github.com
        run: |
          git config user.name  "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          # ~5% de días vacíos para que la grilla se vea natural
          if [ $((RANDOM % 100)) -lt 5 ]; then
            echo "Día libre, sin commits."
            exit 0
          fi

          # Cantidad variable para obtener los distintos tonos de verde:
          # 40% → 1-3, 35% → 4-7, 25% → 8-14
          r=$((RANDOM % 100))
          if   [ $r -lt 40 ]; then n=$((1 + RANDOM % 3))
          elif [ $r -lt 75 ]; then n=$((4 + RANDOM % 4))
          else                     n=$((8 + RANDOM % 7))
          fi

          day=$(date -u +%Y-%m-%d)
          file="logs/auto/$(date -u +%Y)/$(date -u +%m).md"
          mkdir -p "$(dirname "$file")"

          for i in $(seq 1 "$n"); do
            echo "- $day $(date -u +%H:%M:%S) · update $i/$n" >> "$file"
            git add "$file"
            git commit -q -m "chore(log): activity $day ($i/$n)"
          done

          git push
          echo "Pushed $n commits for $day"
